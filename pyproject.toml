[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warnect"
version = "0.8.1"
description = "Python interface to arsya-baileys-open (WhatsApp Web) via a local Node.js bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomli>=2.0; python_version < '3.11'"]
license = { text = "MIT" }
authors = [{ name = "Arsya" }]
keywords = ["whatsapp", "baileys", "warnect", "automation", "bot"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ziole-visa/warnect"
Repository = "https://github.com/ziole-visa/warnect"
Issues = "https://github.com/ziole-visa/warnect/issues"
Changelog = "https://github.com/ziole-visa/warnect/blob/main/CHANGELOG.md"

[project.scripts]
warnect = "warnect.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "pytest-asyncio>=0.23", "build", "twine"]

[tool.setuptools]
packages = ["warnect"]
include-package-data = false

[tool.setuptools.package-data]
warnect = ["bridge/server.js", "bridge/package.json", "bridge/package-lock.json", "bridge/lib/*.js", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
